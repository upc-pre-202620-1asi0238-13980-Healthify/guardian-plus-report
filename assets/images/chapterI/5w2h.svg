<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 484" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1920" height="484" fill="#ffffff"/>
<rect x="12.0" y="12" width="262.3" height="88" fill="#6b6b6b"/>
<text x="143.1" y="61.0" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">What (¿Qué?)</text>
<rect x="12.0" y="110" width="262.3" height="362.0" fill="#d9d9d9"/>
<text x="28.0" y="138.5" fill="#1a1a1a" font-size="12.5">
<tspan x="28.0" dy="0">El problema es que los familiares</tspan>
<tspan x="28.0" dy="16.5">y cuidadores no cuentan con una</tspan>
<tspan x="28.0" dy="16.5">herramienta que les permita</tspan>
<tspan x="28.0" dy="16.5">supervisar de forma oportuna y a</tspan>
<tspan x="28.0" dy="16.5">distancia el estado de las</tspan>
<tspan x="28.0" dy="16.5">personas vulnerables que</tspan>
<tspan x="28.0" dy="16.5">requieren cuidado —adultos</tspan>
<tspan x="28.0" dy="16.5">mayores, personas con</tspan>
<tspan x="28.0" dy="16.5">discapacidad o en situación de</tspan>
<tspan x="28.0" dy="16.5">dependencia— ni ser notificados</tspan>
<tspan x="28.0" dy="16.5">ante eventos que requieran</tspan>
<tspan x="28.0" dy="16.5">atención. Hoy la supervisión</tspan>
<tspan x="28.0" dy="16.5">depende de la presencia física o</tspan>
<tspan x="28.0" dy="16.5">de llamadas esporádicas, lo que</tspan>
<tspan x="28.0" dy="16.5">deja &quot;puntos ciegos&quot; en los que</tspan>
<tspan x="28.0" dy="16.5">una emergencia (una caída, una</tspan>
<tspan x="28.0" dy="16.5">descompensación) puede no</tspan>
<tspan x="28.0" dy="16.5">atenderse a tiempo (Silva</tspan>
<tspan x="28.0" dy="16.5">Contreras et al., 2023; Mestanza</tspan>
<tspan x="28.0" dy="16.5">&amp; Rojas, 2025).</tspan>
</text>
<rect x="284.3" y="12" width="262.3" height="88" fill="#6b6b6b"/>
<text x="415.4" y="61.0" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">When (¿Cuándo?)</text>
<rect x="284.3" y="110" width="262.3" height="362.0" fill="#d9d9d9"/>
<text x="300.3" y="138.5" fill="#1a1a1a" font-size="12.5">
<tspan x="300.3" dy="0">Se presenta principalmente cuando</tspan>
<tspan x="300.3" dy="16.5">la persona que requiere cuidado</tspan>
<tspan x="300.3" dy="16.5">queda sola en casa —en horario</tspan>
<tspan x="300.3" dy="16.5">laboral o de estudios de sus</tspan>
<tspan x="300.3" dy="16.5">familiares—, y se intensifica en</tspan>
<tspan x="300.3" dy="16.5">horarios nocturnos</tspan>
<tspan x="300.3" dy="16.5">(desorientación, caídas al</tspan>
<tspan x="300.3" dy="16.5">movilizarse) y en fines de semana</tspan>
<tspan x="300.3" dy="16.5">o feriados, cuando los servicios</tspan>
<tspan x="300.3" dy="16.5">de salud operan de forma</tspan>
<tspan x="300.3" dy="16.5">limitada. También se agrava en</tspan>
<tspan x="300.3" dy="16.5">etapas de convalecencia</tspan>
<tspan x="300.3" dy="16.5">postoperatoria, enfermedad</tspan>
<tspan x="300.3" dy="16.5">crónica avanzada o mayor grado de</tspan>
<tspan x="300.3" dy="16.5">dependencia (Ceroni, 2021).</tspan>
</text>
<rect x="556.6" y="12" width="262.3" height="88" fill="#6b6b6b"/>
<text x="687.7" y="61.0" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Where (¿Dónde?)</text>
<rect x="556.6" y="110" width="262.3" height="362.0" fill="#d9d9d9"/>
<text x="572.6" y="138.5" fill="#1a1a1a" font-size="12.5">
<tspan x="572.6" dy="0">Ocurre en los hogares de zonas</tspan>
<tspan x="572.6" dy="16.5">urbanas y rurales del Perú donde</tspan>
<tspan x="572.6" dy="16.5">reside la persona que requiere</tspan>
<tspan x="572.6" dy="16.5">cuidado. En el país, más de 3</tspan>
<tspan x="572.6" dy="16.5">millones de personas (10,4 %)</tspan>
<tspan x="572.6" dy="16.5">presentan alguna discapacidad y</tspan>
<tspan x="572.6" dy="16.5">el 40,6 % de ellas depende de</tspan>
<tspan x="572.6" dy="16.5">otra persona para realizar sus</tspan>
<tspan x="572.6" dy="16.5">actividades diarias (INEI,</tspan>
<tspan x="572.6" dy="16.5">ENEDIS). El contexto se agudiza</tspan>
<tspan x="572.6" dy="16.5">por el envejecimiento poblacional</tspan>
<tspan x="572.6" dy="16.5">proyectado al 2050 (INEI, 2025).</tspan>
</text>
<rect x="828.9" y="12" width="262.3" height="88" fill="#6b6b6b"/>
<text x="960.0" y="61.0" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Who (¿Quién?)</text>
<rect x="828.9" y="110" width="262.3" height="362.0" fill="#d9d9d9"/>
<text x="844.9" y="138.5" fill="#1a1a1a" font-size="12.5">
<tspan x="844.9" dy="0">Los usuarios del producto son los</tspan>
<tspan x="844.9" dy="16.5">familiares (hijos, nietos u otros</tspan>
<tspan x="844.9" dy="16.5">responsables que supervisan a</tspan>
<tspan x="844.9" dy="16.5">distancia) y los cuidadores</tspan>
<tspan x="844.9" dy="16.5">(formales o informales,</tspan>
<tspan x="844.9" dy="16.5">particulares o de instituciones),</tspan>
<tspan x="844.9" dy="16.5">que son quienes usan el</tspan>
<tspan x="844.9" dy="16.5">aplicativo móvil. La persona</tspan>
<tspan x="844.9" dy="16.5">vulnerable que requiere cuidado</tspan>
<tspan x="844.9" dy="16.5">—con especial énfasis en los</tspan>
<tspan x="844.9" dy="16.5">adultos mayores— es el sujeto</tspan>
<tspan x="844.9" dy="16.5">monitoreado y la fuente de los</tspan>
<tspan x="844.9" dy="16.5">datos, capturados por el</tspan>
<tspan x="844.9" dy="16.5">dispositivo wearable (Guerrero &amp;</tspan>
<tspan x="844.9" dy="16.5">Pardo, 2024).</tspan>
</text>
<rect x="1101.1" y="12" width="262.3" height="88" fill="#6b6b6b"/>
<text x="1232.3" y="61.0" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Why (¿Por qué?)</text>
<rect x="1101.1" y="110" width="262.3" height="362.0" fill="#d9d9d9"/>
<text x="1117.1" y="138.5" fill="#1a1a1a" font-size="12.5">
<tspan x="1117.1" dy="0">El problema se origina por la</tspan>
<tspan x="1117.1" dy="16.5">carga y la desconexión del</tspan>
<tspan x="1117.1" dy="16.5">cuidador (falta de tiempo,</tspan>
<tspan x="1117.1" dy="16.5">distancia geográfica, alta carga</tspan>
<tspan x="1117.1" dy="16.5">laboral: el 27,1 % deja de</tspan>
<tspan x="1117.1" dy="16.5">trabajar para cuidar) y por la</tspan>
<tspan x="1117.1" dy="16.5">dificultad de acceso oportuno a</tspan>
<tspan x="1117.1" dy="16.5">servicios de salud (ausencia de</tspan>
<tspan x="1117.1" dy="16.5">centros cercanos, seguimiento</tspan>
<tspan x="1117.1" dy="16.5">deficiente de signos vitales,</tspan>
<tspan x="1117.1" dy="16.5">falta de monitoreo en el hogar).</tspan>
<tspan x="1117.1" dy="16.5">En conjunto, la información sobre</tspan>
<tspan x="1117.1" dy="16.5">el estado de la persona a su</tspan>
<tspan x="1117.1" dy="16.5">cuidado llega fragmentada y tarde</tspan>
<tspan x="1117.1" dy="16.5">a quienes deben tomar decisiones</tspan>
<tspan x="1117.1" dy="16.5">(Barrera, 2022; Guerrero &amp; Pardo,</tspan>
<tspan x="1117.1" dy="16.5">2024).</tspan>
</text>
<rect x="1373.4" y="12" width="262.3" height="88" fill="#6b6b6b"/>
<text x="1504.6" y="61.0" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">How (¿Cómo?)</text>
<rect x="1373.4" y="110" width="262.3" height="362.0" fill="#d9d9d9"/>
<text x="1389.4" y="138.5" fill="#1a1a1a" font-size="12.5">
<tspan x="1389.4" dy="0">Guardian+ funciona como un</tspan>
<tspan x="1389.4" dy="16.5">aplicativo móvil que recibe de</tspan>
<tspan x="1389.4" dy="16.5">forma continua los datos enviados</tspan>
<tspan x="1389.4" dy="16.5">por un dispositivo wearable (en</tspan>
<tspan x="1389.4" dy="16.5">esta etapa simulados), los</tspan>
<tspan x="1389.4" dy="16.5">organiza en un dashboard de</tspan>
<tspan x="1389.4" dy="16.5">indicadores comprensible para</tspan>
<tspan x="1389.4" dy="16.5">familiares y cuidadores, y emite</tspan>
<tspan x="1389.4" dy="16.5">notificaciones y alertas ante</tspan>
<tspan x="1389.4" dy="16.5">eventos críticos o valores fuera</tspan>
<tspan x="1389.4" dy="16.5">de rango. Así, el responsable</tspan>
<tspan x="1389.4" dy="16.5">puede reaccionar de inmediato</tspan>
<tspan x="1389.4" dy="16.5">—contactar, acudir o avisar a un</tspan>
<tspan x="1389.4" dy="16.5">servicio de salud— sin depender</tspan>
<tspan x="1389.4" dy="16.5">de estar físicamente presente. La</tspan>
<tspan x="1389.4" dy="16.5">interfaz se diseña simple e</tspan>
<tspan x="1389.4" dy="16.5">intuitiva para asegurar su uso</tspan>
<tspan x="1389.4" dy="16.5">por personas con distintos</tspan>
<tspan x="1389.4" dy="16.5">niveles de familiaridad</tspan>
<tspan x="1389.4" dy="16.5">tecnológica.</tspan>
</text>
<rect x="1645.7" y="12" width="262.3" height="88" fill="#6b6b6b"/>
<text x="1776.9" y="61.0" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">How much (¿Cuánto?)</text>
<rect x="1645.7" y="110" width="262.3" height="362.0" fill="#d9d9d9"/>
<text x="1661.7" y="138.5" fill="#1a1a1a" font-size="12.5">
<tspan x="1661.7" dy="0">La magnitud es alta: más de 3</tspan>
<tspan x="1661.7" dy="16.5">millones de personas con</tspan>
<tspan x="1661.7" dy="16.5">discapacidad en el Perú (10,4 %),</tspan>
<tspan x="1661.7" dy="16.5">de las cuales el 40,6 % depende</tspan>
<tspan x="1661.7" dy="16.5">de otra persona (INEI, ENEDIS);</tspan>
<tspan x="1661.7" dy="16.5">además, 44,6 % de hogares con al</tspan>
<tspan x="1661.7" dy="16.5">menos un adulto mayor (INEI,</tspan>
<tspan x="1661.7" dy="16.5">2025) y 1 de cada 3 mayores de 65</tspan>
<tspan x="1661.7" dy="16.5">años con al menos una caída al</tspan>
<tspan x="1661.7" dy="16.5">año (Gobierno del Perú, 2018). En</tspan>
<tspan x="1661.7" dy="16.5">cuanto al costo de la solución,</tspan>
<tspan x="1661.7" dy="16.5">al ser un producto centrado en el</tspan>
<tspan x="1661.7" dy="16.5">aplicativo móvil, se plantea un</tspan>
<tspan x="1661.7" dy="16.5">modelo freemium/suscripción (plan</tspan>
<tspan x="1661.7" dy="16.5">gratuito básico y plan premium</tspan>
<tspan x="1661.7" dy="16.5">con reportes e historial</tspan>
<tspan x="1661.7" dy="16.5">detallado), manteniendo una</tspan>
<tspan x="1661.7" dy="16.5">inversión inicial baja y</tspan>
<tspan x="1661.7" dy="16.5">favoreciendo la adopción por</tspan>
<tspan x="1661.7" dy="16.5">familias e instituciones.</tspan>
</text>
</svg>